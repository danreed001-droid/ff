name: Draft Analyzer

on:
  schedule:
    # Weekly during the summer/preseason draft window (Tuesdays 09:00 UTC).
    # Cron times are UTC and don't auto-shift for US Daylight Saving Time.
    # This is mainly useful before your draft -- feel free to disable this
    # schedule and just use workflow_dispatch once your draft has happened.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}  # run manually any time from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run draft_analyzer.py
        env:
          # Uncomment/edit to override the defaults in draft_analyzer.py:
          # FANTASY_SCORING_POOL: "500"
          # DRAFT_TOP_N: "200"
          PYTHONUNBUFFERED: "1"
        run: python draft_analyzer.py

      - name: Commit updated draft board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draft_board.html draft_board_half_ppr.csv draft_board_standard.csv sos_config.csv
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Weekly Draft Analyzer update"
          git push
