name: Fantasy Quadrant

on:
  schedule:
    # Tuesday 09:00 UTC -- after Monday Night Football has posted final
    # stats, before most people are setting lineups for the new week.
    # Cron times are UTC and don't auto-shift for US Daylight Saving Time.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}  # lets you run it manually from the Actions tab any time

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fantasy_flow.py
        env:
          # Uncomment/edit any of these to override the defaults in fantasy_flow.py:
          # FANTASY_SCORING: "half_ppr"
          # FANTASY_WATCHLIST: "Christian McCaffrey,Justin Jefferson,..."
          # FANTASY_WEEKS: "12"
          # FANTASY_TREND_SEASONS: "4"
          PYTHONUNBUFFERED: "1"
        run: python fantasy_flow.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Weekly Fantasy Quadrant update"
          git push
